[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "probehub-hub"
version = "0.1.0"
description = "ProbeHub backend: receives probe data and stores it in PostgreSQL"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
probehub-hub = "hub.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
